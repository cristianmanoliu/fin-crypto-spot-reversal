[project]
name = "fin-crypto-spot-reversal"
version = "0.1.0"
description = "Contrarian (mean-reversion) strategy on Kraken spot crypto"
authors = [
    { name = "Cristian Manoliu", email = "cristian.manoliu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fin-crypto-lab",
    "numpy>=2.4.6",
    "polars>=1.41.2",
]

[tool.uv.sources]
fin-crypto-lab = { path = "../fin-crypto-lab", editable = true }

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
